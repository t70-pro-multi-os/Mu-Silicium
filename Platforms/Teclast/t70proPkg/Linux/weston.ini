[core]
idle-time=0
require-input=false

[shell]
locking=false
panel-position=top
background-color=0xff183047
animation=none
cursor-theme=DMZ-White
cursor-size=32

[keyboard]
keymap_layout=us,kr
keymap_options=grp:alt_shift_toggle

[terminal]
font=Noto Sans Mono CJK KR
font-size=16

[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/bin/weston-terminal

[input-method]
path=/usr/libexec/weston-keyboard
